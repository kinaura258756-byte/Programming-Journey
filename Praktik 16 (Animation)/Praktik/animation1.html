<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animation</title>
    <style>
      div {
        width: 100px;
        height: 200px;
        background-color: lightblue;
        animation-duration: 4s;
      }

      @keyframes myAnimation {
        from {
          background-color: lightblue;
        }
        to {
          background-color: lightpink;
        }
      }
    </style>
  </head>
  <body>
    <h1>CSS Animation</h1>
    <div>
      <p>
        <b> Catatan: </b> Setelah animasi selesai, animasi tersebut kembali ke
        bentuk semula.
      </p>
    </div>
  </body>
</html>
